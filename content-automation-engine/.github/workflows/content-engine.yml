name: Advanced Content & CRM Automation

on:
  schedule:
    - cron: "0 9 * * 1,4" # Runs at 9:00 AM UTC on Mondays and Thursdays
  workflow_dispatch: # Allows manual trigger

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Automation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
          
      - name: Commit Generated Content & Drafts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add generated_content/ outreach_drafts/ discovered_topics.json
          git commit -m "Auto-generate new content and outreach drafts" || exit 0
          git push
